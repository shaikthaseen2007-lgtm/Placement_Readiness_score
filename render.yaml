services:
  - type: web
    name: readyset-placement-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: http://localhost:5173
      - key: DATABASE_PATH
        value: /var/data/placement_readiness.db
    disk:
      name: readyset-data
      mountPath: /var/data
      sizeGB: 1
